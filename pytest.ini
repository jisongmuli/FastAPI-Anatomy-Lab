# pytest 全局配置（这个文件也是 pytest 判定"项目根目录"的标志之一）
#
# [pytest] 段：
#   testpaths         不带参数运行 pytest 时，只去 tests/ 找用例（避免去扫 .venv，快很多）
#   addopts           每次运行默认附加的参数：
#                       -q                精简输出
#                       --strict-markers  用了没注册的 marker 就报错（防止拼写错误被静默忽略）
#                       --tb=short        报错时只显示关键堆栈，不刷屏
#   markers           自定义标记，用 pytest -m integration 可以只跑这一类
#
# 注意：ini 文件的注释必须用 #，不能用三引号 —— 这也是个新手坑。

[pytest]
testpaths = tests
addopts = -q --strict-markers --tb=short
markers =
    integration: 需要走完整 HTTP 链路（TestClient）的接口测试
    unit: 只测单个函数/类，不经过 HTTP

[coverage:run]
source = app
omit =
    app/__init__.py
    app/routes/__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
